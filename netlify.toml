# Configuración de Netlify para el sitio de Latorre Propiedades.
#
# Netlify sirve el frontend compilado. Los pedidos a /api los reenvía al backend
# en Render, del lado del servidor: para el navegador todo sale del mismo dominio,
# así que no hay CORS y el frontend no necesita saber dónde vive la API
# (frontend/.env.production apunta a "/api", una ruta relativa).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# IMPORTANTE: si al crear el servicio en Render le ponés otro nombre, cambiá esta URL.
# Tiene que ser la que te muestra Render, con /api al final del destino.
[[redirects]]
  from = "/api/*"
  to = "https://latorre-api.onrender.com/api/:splat"
  status = 200
  force = true

# La app es una SPA: cualquier otra ruta la resuelve React Router, no el servidor.
# Sin esto, entrar directo a /admin/propiedades o recargar la página da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
