<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-latorre.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B4332" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Latorre Propiedades — Inmobiliaria en Coronel Brandsen. Explorá casas, departamentos, locales y campos en venta y alquiler en un mapa interactivo."
    />
    <title>Latorre Propiedades | Coronel Brandsen y alrededores</title>

    <!--
      Vista previa al compartir el link (WhatsApp, Facebook, Instagram, X).

      Sin estas etiquetas, al pegar el link aparece un recuadro vacío o sólo el
      texto. La imagen tiene que ser una dirección completa y no una ruta
      relativa: quien arma la vista previa es el servidor de WhatsApp, no el
      navegador de la persona, y desde afuera "/preview-latorre.jpg" no significa
      nada.

      Va en JPG y no en WEBP ni PNG transparente a propósito: no todos los
      servicios de vista previa soportan WEBP, y la transparencia se suele
      mostrar en negro.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Latorre Propiedades" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Latorre Propiedades | Coronel Brandsen y alrededores" />
    <meta
      property="og:description"
      content="Mirá en el mapa las casas, departamentos, locales y campos en venta y alquiler de Latorre Propiedades."
    />
    <meta property="og:url" content="https://latorre-propiedades.web.app/" />
    <meta property="og:image" content="https://latorre-propiedades.web.app/preview-latorre.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Llaves doradas con llavero en forma de casa" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Latorre Propiedades | Coronel Brandsen y alrededores" />
    <meta
      name="twitter:description"
      content="Mirá en el mapa las casas, departamentos, locales y campos en venta y alquiler de Latorre Propiedades."
    />
    <meta name="twitter:image" content="https://latorre-propiedades.web.app/preview-latorre.jpg" />
    <style>
      html,
      body {
        margin: 0;
        background: #f5f3ee;
      }
      #root {
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
